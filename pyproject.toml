[project]
name = "cloudclinic-ray"
version = "0.1.0"
description = "Scaling Python from Laptop to Cloud with Ray"
requires-python = ">=3.13"
dependencies = [
    "ray[default]==2.58.0",
    "click==8.1.8",
    "rich==15.0.0",
]

[project.optional-dependencies]
core = [
    "spacy==3.8.14",
    "nltk==3.10.3",
    "en-core-web-sm==3.8.0",
]
train = [
    "ray[data,train]==2.58.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
]

[project.scripts]
core-demo = "cloudclinic_ray.core:main"
train-demo = "cloudclinic_ray.train:main"

[dependency-groups]
dev = [
    "pyrefly>=1.3.0",
    "ruff>=0.13",
    "skypilot[aws]==0.13.0",
    "botocore[crt]>=1.40",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.8"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
allowed-confusables = ["ɡ", "ɣ"]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "ICN",
    "ISC",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "RET",
    "RUF",
    "SIM",
    "TC",
    "TRY",
    "UP",
    "W",
]

[tool.pyrefly]
project-includes = ["src/**/*.py*"]
search-path = ["src"]
