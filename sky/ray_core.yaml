resources:
  infra: aws/us-east-1
  cpus: 2+
  memory: 8+
  disk_size: 50
  disk_tier: medium
  autostop:
    idle_minutes: 5
    down: true

num_nodes: 4

workdir: .

envs:
  RAY_ADDRESS: "127.0.0.1:6379"

setup: |
  set -euo pipefail
  uv sync --frozen --no-dev --extra core

run: |
  set -euo pipefail
  source .venv/bin/activate
  ~/sky_templates/ray/stop_cluster || true
  ~/sky_templates/ray/start_cluster
  if [ "$SKYPILOT_NODE_RANK" == "0" ]; then
    core-demo --n-workers "$((2 * SKYPILOT_NUM_NODES))"
  fi
